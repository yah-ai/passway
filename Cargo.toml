# passway is its own Cargo workspace (R594-F4, 2026-07-02) — the sovereign
# public-ingress L7 proxy for W267's Tier-1 "rented doorknob" edge. Kept as
# an independent workspace (not a yah root-workspace member, no
# `workspace = true` inheritance from yah root — A0057) so it stays
# buildable standalone once exported to github.com/yah-ai/passway — see
# scripts/export-oss.sh and root Cargo.toml's `exclude = ["oss", "external"]`.
#
# `passway` is an operator-blessed bare crate/binary name (crates.io-free,
# verified 2026-07-02) — do NOT add a `yah-` prefix, do NOT run
# reserve-crate-names.sh or `cargo publish` here; that is the operator's
# move, not this ticket's.
[workspace]
members = ["crates/passway", "crates/acme-engine", "crates/sni-demux"]
resolver = "2"

# R853-F6 (2026-09-04): the carried pingora fork is GONE. passway used to pin
# all 14 pingora crates to github.com/yah-ai/pingora for one added API,
# `Server::seed_listen_fd`. It now hands the inherited socket to its own server
# over pingora's existing upgrade socket instead — the only public seam into
# pingora's fd table — so stock crates.io pingora is enough. See
# crates/passway/src/socket_activation.rs and the standalone proof in
# spikes/R853-S5-upgrade-socket-handoff/.
#
# R853-T1 (2026-09-05): the `patches/` directory is GONE too, by operator
# decision — with the fork deleted there is nothing left to upstream on our own
# behalf. History is at `git show be2680f4:oss/passway/patches/`.
#
# For the record, since the shape of this invites the wrong conclusion: the fork
# was NOT taken on bad information. W267 weighed this exact upgrade-socket route
# on 2026-08-28 and rejected it ("works; points the wrong way"). It was reversed
# on evidence that arrived later — R853-S5 proved the rejected route sound, and
# `[patch.crates-io]`'s non-propagation to published crates turned out to cost
# more than the fork was worth. See crates/passway/src/socket_activation.rs.
#
# Do NOT reintroduce a [patch.crates-io] block here without reading that: it
# does not propagate to consumers, so it silently breaks `cargo install passway`
# for everyone on crates.io while working fine in this monorepo.

[workspace.package]
version = "0.8.33"
edition = "2021"
authors = ["yah Dev <human@yah.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yah-ai/passway"
