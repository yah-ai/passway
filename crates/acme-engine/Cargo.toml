[package]
# R635: `acme-engine` on crates.io is an unrelated 0.4.0 crate, so our
# `acme-engine = "0.8.x"` could never resolve from the registry — which
# hard-blocked the `yubaba` crate and, through it, the whole root workspace.
# Published as `passway-acme`; `[lib] name` below keeps `use acme_engine::…`
# working, so consumers alias via `package =` and no .rs changed.
name = "passway-acme"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Provider-agnostic ACME (RFC-8555 / Let's Encrypt) certificate issuance engine: account registration, HTTP-01 + DNS-01-via-Cloudflare challenge completion, and finalization to an in-memory cert chain + key. No disk cert writes, no listener — the caller owns deployment."
keywords = ["acme", "letsencrypt", "tls", "certificate", "rfc8555"]
categories = ["cryptography", "network-programming"]

# Keeps the extern name `acme_engine` for this crate's own tests and examples,
# and lets consumers keep `use acme_engine::…` via the `package =` alias.
[lib]
name = "acme_engine"

[dependencies]
# The RFC-8555 protocol client. Apache-2.0 (permissive — verified via `cargo
# info instant-acme` and `cargo deny check`). `default-features = false`
# drops the crate's own default `aws-lc-rs` crypto backend in favor of
# `ring` (feature "ring") to match the provider a `pingora-rustls` edge
# installs at runtime, so this dependency declaration doesn't add its own,
# separate reason to need `aws-lc-rs`. `hyper-rustls` is instant-acme's
# built-in HTTPS client (talks to the ACME directory over rustls, never
# native-tls); `rcgen` lets `Order::finalize()` generate the end-entity
# keypair + CSR so this engine never hand-rolls X.509. See the crate-level
# module doc for the full crate-choice rationale.
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }

# The DNS-01 provider client (Cloudflare TXT record create/delete).
# rustls-tls only, no native-tls — matches the all-rustls posture of the
# passway edge this engine was extracted from.
reqwest = { version = "0.12", features = ["rustls-tls", "http2", "json"], default-features = false }

serde_json = "1"
log = "0.4"
# `sync` (RwLock, for the shared HTTP-01 `ChallengeTokens` map the caller's
# responder answers from) and `time` (`sleep` for the DNS-01 propagation
# wait). No `net`/`io-util`: the HTTP-01 *responder* is the caller's, not
# this engine's.
tokio = { version = "1", features = ["sync", "time"] }

# R853-B8 — `cert_dns_names` reads the SAN set off the cert already on disk so
# a renewal can be driven by COVERAGE, not just by age. Parsing only, no
# verification and no crypto: this crate never validates a chain, it asks
# "which names does this file claim". MIT OR Apache-2.0, already in this
# workspace's graph (it arrived as the R779-P8 Pebble test's dev-dep, and this
# promotes it to a real dependency rather than adding a new one).
x509-parser = "0.18"

# R779-P8 — only the DNS-01 delegation integration test
# (`tests/pebble_dns01_delegation.rs`) needs these; none reaches the library.
# Real versions, never `"*"`: `deny.toml` sets `bans.wildcards = "deny"`.
[dev-dependencies]
# The test hand-rolls a Cloudflare-shaped HTTP/1.1 shim on a `TcpListener`
# (`net` + `io-util` + `macros`/`rt-multi-thread` for `#[tokio::test]`).
# Deliberately not an HTTP-server crate: one ~150-line request loop is cheaper
# than a framework dependency on a trust-boundary workspace. Docker is driven
# with `std::process::Command`, not tokio's — the teardown guard is a `Drop`
# impl, which cannot await.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
# Drives challtestsrv's plain-HTTP management API (`/set-txt`, `/set-cname`).
# `rustls-tls` is carried because the shared `reqwest` build in this graph has
# it; nothing in the test speaks TLS through this client.
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
serde_json = "1"
# Holds Pebble's fetched root PEM for the life of the test — the path handed
# to `IssueConfig::directory_root_cert`.
tempfile = "3"
# R853-B8 — mints self-signed certs so the `cert_dns_names` tests assert
# against a real DER encoding rather than a checked-in fixture that could rot
# into agreeing with a hand-written blob. Already a direct dep of the
# `passway` crate at the same version, and reached here anyway through
# instant-acme's `rcgen` feature.
rcgen = "0.14"
