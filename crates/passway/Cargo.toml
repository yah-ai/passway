[package]
name = "passway"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Sovereign public-ingress L7 proxy (R594-F4 / W267 Tier-1): pingora-based reverse proxy with rustls TLS termination, cheers-verify edge auth, and request-smuggling hardening."
keywords = ["proxy", "ingress", "pingora", "tls", "edge"]
categories = ["network-programming", "web-programming::http-server"]
readme = "README.md"
# R743-T6: the 6 integration-test files under tests/ used to each build as
# their own binary (autotests' default per-file discovery), so `common`
# (tests/common/mod.rs) — plus pingora and the rest of this crate's dep
# graph — got compiled fresh 6 times. They're consolidated into one binary
# (tests/main.rs, mod'ing all 6 siblings + common once) built via the
# explicit [[test]] below; autotests = false stops cargo from *also*
# auto-discovering each tests/*.rs as its own binary on top of that.
autotests = false

# TRUST-BOUNDARY crate: public-facing listener + edge auth path. Pin
# `pingora >= 0.8.1` (R594-S1 spike verdict — request-smuggling fix
# CVE-2025-4366 / RUSTSEC-2025-0037 landed in 0.5.0; 0.8.1 is the tested
# version). `rustls` + `lb` features ONLY: rustls is the sole TLS backend
# this crate ever links (never boringssl/openssl — see deny.toml's explicit
# bans), and `lb` pulls in pingora-proxy + pingora-load-balancing so this one
# dependency covers the whole L7-proxy-plus-round-robin surface.
[dependencies]
pingora = { version = ">=0.8.1", features = ["rustls", "lb"] }

async-trait = "0.1"
bytes = "1"
http = "1"
# RFC 3986 percent-decoding for the auth-path canonicalizer (path.rs). Already
# in the graph transitively via pingora; taken as a direct dep so the
# trust-boundary path-normalization logic doesn't hand-roll a decoder.
percent-encoding = "2"
# `io-util` (BufReader/AsyncBufReadExt/AsyncWriteExt): the R594-F7 ACME
# HTTP-01 responder (acme.rs) hand-rolls its own tiny HTTP/1.1 GET handler
# over raw tokio TCP streams rather than pulling in a full HTTP server dep
# for a handful of well-known-path responses.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

# R594-F7 / R600-F3: automated Let's Encrypt (ACME/RFC-8555) issuance +
# renewal for tls::TlsMode::Acme. The provider-agnostic issuance engine now
# lives in the sibling `acme-engine` crate (extracted so a second workspace
# can consume it); this crate is the pingora deployment shell over it —
# env-config parsing, the HTTP-01 responder, cert-to-disk writes, and the
# `BackgroundService` renewal loop. See acme.rs's module doc for the shell's
# rationale (HTTP-01, not TLS-ALPN-01 — pingora's static rustls
# `TlsSettings` can't serve a dynamic per-ALPN challenge cert on the same
# port the production listener already owns) and acme-engine's module doc
# for the instant-acme crate-choice rationale.
# R635: published as `passway-acme` (the `acme-engine` name on crates.io is an
# unrelated crate). The alias keeps `use acme_engine::…` in this crate's source
# unchanged; the `version` req is what crates.io requires of a path dep.
acme-engine = { package = "passway-acme", path = "../acme-engine", version = "0.8.33" }

# cheers-verify edge auth (R594-F4 V0 MUST #3): PasetoV4PublicVerifier +
# McpClaims, path+version dep into the co-developed oss/cheers workspace —
# the same shape `crates/yah/cloud-admin` (this platform's only other
# in-tree consumer of cheers-verify outside the cheers workspace itself)
# already uses. cheers-verify holds no minter (edge-safe by construction),
# so a compromised passway process cannot forge a session.
cheers-core = { path = "../../../cheers/crates/cheers-core", version = "0.8.33" }
cheers-verify = { path = "../../../cheers/crates/cheers-verify", version = "0.8.33" }

# HTTP client, two uses: `discovery.rs`'s poll of yubaba's service-record
# surface (R594-F8) and the integration tests, which drive the running proxy
# over loopback. rustls-tls only, no native-tls — matches this crate's
# all-rustls posture and deny.toml's TLS-backend bans. Already in the
# workspace graph via `acme-engine`'s DNS-01 client, so this adds no new
# transitive surface. (It was dev-only between R600-F3 and R594-F8.)
reqwest = { version = "0.12", features = ["rustls-tls", "http2", "json"], default-features = false }

[features]
# R853-F6: back to default-on, 2026-09-04. It was `[]` between 2026-08-31 and
# then for exactly one reason — `cargo publish --verify` packages and builds
# the tarball standalone, so the workspace `[patch.crates-io]` → yah-ai/pingora
# fork never applied there and a default-on feature failed publish
# verification. That reason died with the fork: this now builds against stock
# crates.io pingora, so the tarball builds and `cargo install passway` gets a
# working socket-activation path instead of one that cannot compile.
default = ["socket-activation"]
# Adopt an inherited listening socket (systemd LISTEN_FDS / kamaji's on-demand
# JIT tier) instead of binding PASSWAY_LISTEN fresh, by transferring the fd
# into pingora's own listener table over its upgrade socket — the only public
# seam into that table (R853-S5; `Server::listen_fds` is private and
# `ServerAddress` has no fd variant).
#
# LINUX-ONLY at runtime, and not by our choice: pingora's fd transfer is
# `#[cfg(target_os = "linux")]` on 0.8.1 and on main alike, with the other
# platforms' `get_fds_from` returning ECONNREFUSED. It compiles everywhere; on
# a non-Linux build `main` refuses loudly if LISTEN_FDS is set rather than
# binding fresh behind the supervisor's back.
#
# Kept as a feature rather than deleted so passway can still be built without
# the path at all, and because removing a feature name from a published crate
# is a breaking change for anyone who passes it.
socket-activation = []

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
pasetors = "0.7"
# R779 `tests/jit_cold_start.rs` — the end-to-end proof that passway serves
# from behind a supervisor that holds the listen socket. All three are already
# in this workspace's graph, so they add no new transitive surface:
#   rcgen        — already a direct dep of instant-acme (same `ring` backend);
#                  mints the self-signed leaf the forked binary serves.
#   libc         — the `dup2`/`fcntl` pair the `pre_exec` hook needs to put the
#                  held socket on fd 3, mirroring kamaji's `jit.rs`.
#   passway-demux — the real demux, driven in-process, so the test exercises the
#                  actual SNI path rather than a stand-in for it.
# (No `tempfile`: this crate deliberately hand-rolls its scratch dirs — see
# `acme.rs`'s test `TempDir` — and the JIT test reuses that idiom.)
rcgen = "0.14"
libc = "0.2"
# Versioned like every other path dep here: deny.toml sets `wildcards = "deny"`,
# so a bare `path =` fails `cargo deny check bans`.
passway-demux = { path = "../sni-demux", version = "0.8.33" }

[[test]]
name = "main"
path = "tests/main.rs"
